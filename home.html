<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoCreate – Home</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="mobile-frame">
    <div class="mobile-content">
      <div class="container">
    <div class="header">
      <img id="me" class="avatar" src="" alt="me" />
      <input class="button" style="flex:1; text-align:left" value="Add a project idea ..." onclick="openAddProject()" />
      <button class="button" onclick="CoCreate.nav('share.html')" title="Share">📤</button>
    </div>

    <div style="display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap;">
      <select id="category-filter" style="background: #fff8dc; border: 1px solid #ffd700; color: #8b0000; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; appearance: none; background-image: url('data:image/svg+xml;charset=UTF-8,%3csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%238b0000\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'%3e%3cpolyline points=\'6,9 12,15 18,9\'%3e%3c/polyline%3e%3c/svg%3e'); background-repeat: no-repeat; background-position: right 8px center; background-size: 12px; padding-right: 28px; min-width: 120px;">
        <option value="all">All Categories</option>
        <option value="Project">Project</option>
        <option value="Hackathon">Hackathon</option>
        <option value="Case Comp">Case Comp</option>
      </select>
      <select id="sort-filter" style="background: #fff8dc; border: 1px solid #ffd700; color: #8b0000; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; appearance: none; background-image: url('data:image/svg+xml;charset=UTF-8,%3csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%238b0000\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'%3e%3cpolyline points=\'6,9 12,15 18,9\'%3e%3c/polyline%3e%3c/svg%3e'); background-repeat: no-repeat; background-position: right 8px center; background-size: 12px; padding-right: 28px; min-width: 100px;">
        <option value="latest">Latest</option>
        <option value="match">Best Match</option>
        <option value="saved">Most Saved</option>
      </select>
      <select id="skill-filter" style="background: #fff8dc; border: 1px solid #ffd700; color: #8b0000; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; appearance: none; background-image: url('data:image/svg+xml;charset=UTF-8,%3csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%238b0000\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'%3e%3cpolyline points=\'6,9 12,15 18,9\'%3e%3c/polyline%3e%3c/svg%3e'); background-repeat: no-repeat; background-position: right 8px center; background-size: 12px; padding-right: 28px; min-width: 100px;">
        <option value="all">All Skills</option>
        <option value="React">React</option>
        <option value="Figma">Figma</option>
        <option value="Data Visualization">Data Viz</option>
        <option value="UX Design">UX Design</option>
        <option value="API Integration">API</option>
      </select>
    </div>

    <div id="feed"></div>

    <div class="section-title">Suggested projects for you</div>
    <div id="suggested"></div>

    <div class="footer-space"></div>
      </div>
    </div>
    
    <div class="navbar">
    <a class="active">Home</a>
    <a onclick="CoCreate.nav('dms.html')">DMs</a>
    <a onclick="CoCreate.nav('saved.html')">Saved</a>
    <a onclick="CoCreate.nav('profile.html')">My Profile</a>
    <a onclick="CoCreate.nav('taskboard.html')">Task Board</a>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/matching.js"></script>
  <script>
    const user = CoCreate.ensureAuth();
    document.getElementById('me').src = user.photo;

    let currentFilter = 'all';
    let currentSort = 'latest';
    let currentSkill = 'all';

    function openAddProject(){
      const title = prompt('Project title');
      if(!title) return;
      const overview = prompt('Short overview') || '';
      const category = prompt('Category (Project / Hackathon / Case Comp)') || 'Project';
      const skills = prompt('Required skills (comma separated)') || '';
      const p = {
        id: 'p' + Date.now(),
        title,
        overview,
        category,
        requiredSkills: skills.split(',').map(s=>s.trim()).filter(Boolean),
        timeRequired: '3-5 hours/week',
        creatorId: user.id,
        team: [],
        savedBy: [],
        postedAt: new Date().toDateString()
      };
      CoCreateData.projects.unshift(p);
      CoCreate.toast('Project added');
      render();
    }

    function openMessageModal(){
      const modal = document.createElement('div');
      modal.className = 'message-modal';
      modal.innerHTML = `
        <div class="message-content">
          <div class="message-header">
            <div style="font-weight:600">Messages</div>
            <button class="button" onclick="this.closest('.message-modal').remove()">×</button>
          </div>
          <div class="message-list">
            <div class="message-item">
              <div class="small">No messages yet. Start conversations by messaging project creators!</div>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function render(){
      let projects = [...CoCreateData.projects];
      
      // Filter by category
      if(currentFilter !== 'all'){
        projects = projects.filter(p => p.category === currentFilter);
      }
      
      // Filter by skill
      if(currentSkill !== 'all'){
        projects = projects.filter(p => p.requiredSkills.includes(currentSkill));
      }
      
      // Sort
      if(currentSort === 'latest'){
        projects.sort((a,b) => new Date(b.postedAt) - new Date(a.postedAt));
      } else if(currentSort === 'match'){
        projects.sort((a,b) => {
          const aMatch = computeMatchPercent(user.skills||[], a.requiredSkills||[]);
          const bMatch = computeMatchPercent(user.skills||[], b.requiredSkills||[]);
          return bMatch - aMatch;
        });
      } else if(currentSort === 'saved'){
        projects.sort((a,b) => b.savedBy.length - a.savedBy.length);
      }

      const feed = document.getElementById('feed');
      feed.innerHTML = '';
      projects.forEach(p => {
        const creator = getUserById(p.creatorId) || user;
        const percent = computeMatchPercent(user.skills||[], p.requiredSkills||[]);
        const el = document.createElement('div');
        el.className = 'card project-card';
        el.innerHTML = `
          <div class="badge">${p.category}</div>
          <div class="meta">
            <img class="avatar" src="${creator.photo}" />
            <div>${creator.name} · <span class="small">${p.postedAt}</span></div>
          </div>
          <div style="font-weight:700">${p.title}</div>
          <div class="small" style="margin-top:6px">${p.overview}</div>
          <div class="chips" style="margin-top:10px">${p.requiredSkills.map(s=>`<span class='chip'>${s}</span>`).join('')}</div>
          <div style="margin-top:8px">${renderMatchChip(percent)}</div>
          <div class="actions" style="display:flex; gap:8px; align-items:center">
            <button class="button primary" onclick="openProject('${p.id}')">View</button>
            <button class="button" onclick="messageCreator('${creator.id}')" style="background:var(--primary); color:#fff; border-color:var(--primary)">Message</button>
            <button onclick="saveProject('${p.id}')" style="background:none; border:none; font-size:20px; cursor:pointer; color:${p.savedBy.includes(user.id)?'var(--primary)':'var(--muted)'}" title="${p.savedBy.includes(user.id)?'Saved':'Save'}">${p.savedBy.includes(user.id)?'🔖':'📌'}</button>
          </div>
        `;
        feed.appendChild(el);
      });

      const suggested = document.getElementById('suggested');
      suggested.innerHTML = '';
      CoCreateData.projects
        .map(p => ({ p, percent: computeMatchPercent(user.skills||[], p.requiredSkills||[]) }))
        .sort((a,b)=>b.percent-a.percent)
        .slice(0,3)
        .forEach(({p, percent}) => {
          const item = document.createElement('div');
          item.className = 'card';
          item.innerHTML = `
            <div class="row" style="justify-content:space-between; align-items:center">
              <div>
                <div style="font-weight:600">${p.title}</div>
                <div class="small">Overview: ${p.overview.slice(0,60)}...</div>
              </div>
              ${renderMatchChip(percent)}
            </div>
            <div class="actions" style="margin-top:8px; display:flex; gap:8px; align-items:center">
              <button class="button" onclick="openProject('${p.id}')">Open</button>
              <button class="button primary" onclick="joinProject('${p.id}')">Join</button>
              <button onclick="saveProject('${p.id}')" style="background:none; border:none; font-size:18px; cursor:pointer; color:${p.savedBy.includes(user.id)?'var(--primary)':'var(--muted)'}" title="${p.savedBy.includes(user.id)?'Saved':'Save'}">${p.savedBy.includes(user.id)?'🔖':'📌'}</button>
            </div>
          `;
          suggested.appendChild(item);
        });
    }

    // Filter handlers
    document.getElementById('category-filter').addEventListener('change', (e) => {
      currentFilter = e.target.value;
      render();
    });
    
    document.getElementById('sort-filter').addEventListener('change', (e) => {
      currentSort = e.target.value;
      render();
    });
    
    document.getElementById('skill-filter').addEventListener('change', (e) => {
      currentSkill = e.target.value;
      render();
    });

    window.saveProject = function(id){
      const p = getProjectById(id); if(!p) return;
      if(!p.savedBy.includes(user.id)) p.savedBy.push(user.id);
      CoCreate.saveData();
      CoCreate.toast('Saved');
      render();
    };

    window.messageCreator = function(uid){
      const u = getUserById(uid) || user;
      const modal = document.createElement('div');
      modal.className = 'message-modal';
      modal.innerHTML = `
        <div class="message-content">
          <div class="message-header">
            <div style="font-weight:600">Message ${u.name}</div>
            <button class="button" onclick="this.closest('.message-modal').remove()">×</button>
          </div>
          <div class="message-list" id="message-list">
            <div class="message-item">
              <div class="small">No messages yet. Start the conversation!</div>
            </div>
          </div>
          <div class="message-input">
            <input id="message-text" placeholder="Type your message..." />
            <button class="button primary" onclick="sendMessage('${u.id}')">Send</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      document.getElementById('message-text').focus();
    };

    window.sendMessage = function(recipientId){
      const text = document.getElementById('message-text').value.trim();
      if(!text) return;
      
      const message = {
        id: 'm' + Date.now(),
        from: user.id,
        to: recipientId,
        text,
        timestamp: new Date().toISOString()
      };
      
      CoCreateData.messages.push(message);
      CoCreate.saveData();
      CoCreate.toast('Message sent');
      document.getElementById('message-text').value = '';
    };

    window.openProject = function(id){
      localStorage.setItem('cocreate_project_id', id);
      CoCreate.nav('project.html');
    };

    window.joinProject = function(id){
      const p = getProjectById(id); if(!p) return;
      if(!p.team.includes(user.id)) p.team.push(user.id);
      CoCreate.saveData();
      CoCreate.toast('Request to join sent');
      render();
    };

    render();
  </script>
</body>
</html>
