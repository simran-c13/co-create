<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoCreate – Sign In</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="mobile-frame">
    <div class="mobile-content">
      <div class="container">
    <div class="center">
      <div class="brand-hello">Hello.</div>
      <div class="subtitle">Let's create together!</div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="form">
        <label class="small">Email</label>
        <input id="email" type="email" placeholder="Enter .edu email" />
        <label class="small">Password</label>
        <div class="row">
          <input id="password" type="password" placeholder="Enter password" />
        </div>
        <button id="signin" class="button primary block">Sign In</button>
        <div class="center small">OR CONTINUE WITH</div>
        <div class="row" style="justify-content:center">
          <button class="button">G</button>
          <button class="button"></button>
        </div>
      </div>
    </div>

    <div class="center small" style="margin-top:16px">Don't have an account? <a href="signup.html">Sign up</a></div>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    document.getElementById('signin').addEventListener('click', () => {
      if(!email.value){ CoCreate.toast('Enter email'); return; }
      // Lightweight sign-in: if email matches known, sign in, else go signup
      const u = CoCreateData.users.find(x => x.email.toLowerCase() === email.value.toLowerCase());
      if(u){
        CoCreate.saveCurrentUser(u);
        CoCreate.toast('Welcome back, ' + u.name.split(' ')[0]);
        setTimeout(() => CoCreate.nav('home.html'), 400);
      } else {
        localStorage.setItem('cocreate_prefill_email', email.value);
        CoCreate.nav('signup.html');
      }
    });
  </script>
</body>
</html>
